<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Forge Image Editor</title>

<style>
*{box-sizing:border-box}

:root{
    --bg:#171717;
    --panel:#202020;
    --panel2:#252525;
    --panel3:#2c2c2c;
    --border:#3b3b3b;
    --text:#e7e7e7;
    --muted:#999;
    --accent:#4b9cff;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    user-select:none;
}

button,input,select{
    font:inherit;
}

button{
    color:var(--text);
}

#app{
    width:100vw;
    height:100vh;
    display:grid;
    grid-template-rows:42px 1fr;
}

/* TOP */

#topbar{
    display:flex;
    align-items:center;
    gap:5px;
    padding:0 8px;
    background:#191919;
    border-bottom:1px solid var(--border);
}

.brand{
    font-size:14px;
    font-weight:700;
    letter-spacing:.5px;
    margin-right:10px;
}

.top-button{
    height:28px;
    padding:0 10px;
    border:1px solid transparent;
    border-radius:4px;
    background:transparent;
    cursor:pointer;
}

.top-button:hover{
    background:#292929;
    border-color:#3d3d3d;
}

.top-separator{
    width:1px;
    height:20px;
    background:var(--border);
    margin:0 4px;
}

.zoom-display{
    min-width:58px;
    text-align:center;
    color:var(--muted);
    font-size:12px;
}

#fileInput{
    display:none;
}

/* MAIN */

#main{
    min-height:0;
    display:grid;
    grid-template-columns:58px 1fr 300px;
}

/* TOOLBAR */

#toolbar{
    background:#1c1c1c;
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:7px 0;
    gap:3px;
    overflow-y:auto;
}

.tool{
    width:40px;
    height:36px;
    flex-shrink:0;
    border:1px solid transparent;
    border-radius:5px;
    background:transparent;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
}

.tool:hover{
    background:#292929;
}

.tool.active{
    background:#303b4a;
    border-color:#496784;
}

.tool-separator{
    width:30px;
    height:1px;
    background:var(--border);
    margin:4px 0;
    flex-shrink:0;
}

.tool-group-label{
    font-size:8px;
    color:#777;
    text-transform:uppercase;
    margin:3px 0;
}

/* WORKSPACE */

#workspace{
    position:relative;
    overflow:hidden;
    background:
        linear-gradient(45deg,#252525 25%,transparent 25%),
        linear-gradient(-45deg,#252525 25%,transparent 25%),
        linear-gradient(45deg,transparent 75%,#252525 75%),
        linear-gradient(-45deg,transparent 75%,#252525 75%);
    background-size:24px 24px;
    background-position:
        0 0,
        0 12px,
        12px -12px,
        -12px 0;
    cursor:default;
}

#canvasViewport{
    position:absolute;
    left:0;
    top:0;
    transform-origin:0 0;
}

#displayCanvas,
#overlayCanvas{
    position:absolute;
    left:0;
    top:0;
    display:block;
}

#overlayCanvas{
    pointer-events:none;
}

#workspaceStatus{
    position:absolute;
    left:10px;
    bottom:8px;
    padding:5px 8px;
    background:rgba(20,20,20,.85);
    border:1px solid #3b3b3b;
    border-radius:4px;
    color:#aaa;
    font-size:11px;
    pointer-events:none;
}

/* SIDEBAR */

#sidebar{
    min-height:0;
    overflow:hidden;
    background:var(--panel);
    border-left:1px solid var(--border);
    display:flex;
    flex-direction:column;
}

.panel{
    border-bottom:1px solid var(--border);
    flex-shrink:0;
}

.panel-title{
    height:32px;
    display:flex;
    align-items:center;
    padding:0 10px;
    background:#222;
    font-size:11px;
    font-weight:700;
    letter-spacing:.7px;
    text-transform:uppercase;
}

.panel-content{
    padding:9px;
}

.option-row{
    display:grid;
    grid-template-columns:90px 1fr;
    align-items:center;
    gap:7px;
    min-height:28px;
}

.option-row+.option-row{
    margin-top:5px;
}

.option-label{
    font-size:11px;
    color:#aaa;
}

input[type=text],
input[type=number],
select{
    width:100%;
    height:27px;
    background:#171717;
    color:#ddd;
    border:1px solid #3c3c3c;
    border-radius:3px;
    padding:3px 7px;
    outline:none;
}

input[type=text]:focus,
input[type=number]:focus,
select:focus{
    border-color:var(--accent);
}

input[type=range]{
    width:100%;
    accent-color:var(--accent);
}

input[type=color]{
    width:100%;
    height:27px;
    padding:1px;
    background:#171717;
    border:1px solid #3c3c3c;
}

.small-button{
    min-height:26px;
    padding:3px 8px;
    border:1px solid #414141;
    border-radius:3px;
    background:#292929;
    cursor:pointer;
    font-size:11px;
}

.small-button:hover{
    background:#353535;
}

.small-button:disabled{
    opacity:.4;
    cursor:default;
}

.button-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:5px;
}

.button-grid.three{
    grid-template-columns:1fr 1fr 1fr;
}

/* LAYERS */

#layersPanel{
    min-height:0;
    flex:1;
    display:flex;
    flex-direction:column;
}

#layersHeader{
    height:32px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 7px 0 10px;
    background:#222;
    border-bottom:1px solid var(--border);
}

#layersHeader span{
    font-size:11px;
    font-weight:700;
    letter-spacing:.7px;
    text-transform:uppercase;
}

.layer-actions{
    display:flex;
    gap:2px;
}

.icon-button{
    width:25px;
    height:24px;
    border:1px solid transparent;
    border-radius:3px;
    background:transparent;
    cursor:pointer;
}

.icon-button:hover{
    background:#333;
    border-color:#444;
}

#layersList{
    min-height:0;
    overflow:auto;
    padding:4px;
}

.layer-row{
    height:48px;
    display:grid;
    grid-template-columns:24px 40px 1fr 24px;
    align-items:center;
    gap:5px;
    padding:3px 4px;
    border:1px solid transparent;
    border-radius:4px;
    cursor:pointer;
}

.layer-row:hover{
    background:#2a2a2a;
}

.layer-row.selected{
    background:#303b4a;
    border-color:#405a77;
}

.layer-row.drag-over{
    border-top:2px solid var(--accent);
}

.layer-visibility{
    width:22px;
    height:22px;
    padding:0;
    border:0;
    background:transparent;
    cursor:pointer;
    color:#ccc;
}

.layer-thumb{
    width:38px;
    height:38px;
    border:1px solid #484848;
    background:
        linear-gradient(45deg,#333 25%,transparent 25%),
        linear-gradient(-45deg,#333 25%,transparent 25%),
        linear-gradient(45deg,transparent 75%,#333 75%),
        linear-gradient(-45deg,transparent 75%,#333 75%);
    background-size:10px 10px;
    background-position:
        0 0,
        0 5px,
        5px -5px,
        -5px 0;
    overflow:hidden;
}

.layer-thumb canvas{
    width:100%;
    height:100%;
    display:block;
}

.layer-info{
    min-width:0;
}

.layer-name{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    font-size:11px;
}

.layer-type{
    color:#858585;
    font-size:9px;
    margin-top:2px;
}

.mask-badge{
    width:20px;
    height:20px;
    border:1px solid #555;
    background:#eee;
    color:#222;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:9px;
}

/* MODAL */

.modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;
}

.modal-backdrop.show{
    display:flex;
}

.modal{
    width:380px;
    background:#242424;
    border:1px solid #444;
    border-radius:6px;
    box-shadow:0 20px 70px rgba(0,0,0,.6);
}

.modal-header{
    padding:12px 14px;
    border-bottom:1px solid #3b3b3b;
    font-size:14px;
    font-weight:600;
}

.modal-body{
    padding:14px;
}

.modal-footer{
    padding:10px 14px;
    border-top:1px solid #3b3b3b;
    display:flex;
    justify-content:flex-end;
    gap:7px;
}

.modal-field{
    margin-bottom:12px;
}

.modal label{
    display:block;
    font-size:11px;
    color:#aaa;
    margin-bottom:5px;
}

::-webkit-scrollbar{
    width:8px;
    height:8px;
}

::-webkit-scrollbar-track{
    background:#191919;
}

::-webkit-scrollbar-thumb{
    background:#3d3d3d;
    border-radius:4px;
}
</style>
</head>

<body>

<div id="app">

<header id="topbar">

    <div class="brand">FORGE</div>

    <button class="top-button" id="newBtn">New</button>
    <button class="top-button" id="openBtn">Open</button>
    <button class="top-button" id="exportBtn">Export PNG</button>

    <div class="top-separator"></div>

    <button class="top-button" id="undoBtn">Undo</button>
    <button class="top-button" id="redoBtn">Redo</button>

    <div class="top-separator"></div>

    <button class="top-button" id="zoomOutBtn">−</button>
    <div class="zoom-display" id="zoomDisplay">100%</div>
    <button class="top-button" id="zoomInBtn">+</button>
    <button class="top-button" id="fitBtn">Fit</button>

    <input
        id="fileInput"
        type="file"
        accept="image/png,image/jpeg,image/webp,image/gif"
    >

</header>

<main id="main">

<aside id="toolbar">

    <button class="tool active" data-tool="move" title="Move (V)">↖</button>
    <button class="tool" data-tool="hand" title="Hand (H)">✋</button>

    <div class="tool-separator"></div>

    <div class="tool-group-label">Paint</div>

    <button class="tool" data-tool="brush" title="Brush (B)">●</button>
    <button class="tool" data-tool="pencil" title="Pencil (N)">✎</button>
    <button class="tool" data-tool="eraser" title="Eraser (E)">⌫</button>
    <button class="tool" data-tool="bucket" title="Paint Bucket (G)">▰</button>
    <button class="tool" data-tool="gradient" title="Gradient">▱</button>
    <button class="tool" data-tool="eyedropper" title="Eyedropper (I)">⌾</button>

    <div class="tool-separator"></div>

    <div class="tool-group-label">Select</div>

    <button class="tool" data-tool="rectSelect" title="Rectangular Marquee (M)">□</button>
    <button class="tool" data-tool="ellipseSelect" title="Elliptical Marquee">○</button>
    <button class="tool" data-tool="lasso" title="Lasso (L)">⌁</button>
    <button class="tool" data-tool="polygonSelect" title="Polygonal Lasso">◇</button>

    <div class="tool-separator"></div>

    <div class="tool-group-label">Shape</div>

    <button class="tool" data-tool="line" title="Line">╱</button>
    <button class="tool" data-tool="rectangle" title="Rectangle">▭</button>
    <button class="tool" data-tool="ellipse" title="Ellipse">◯</button>

    <div class="tool-separator"></div>

    <button class="tool" data-tool="crop" title="Crop">▣</button>

    <div class="tool-separator"></div>

    <button
        class="tool"
        id="foregroundButton"
        title="Foreground colour"
    >
        <span
            id="foregroundSwatch"
            style="
                width:20px;
                height:20px;
                display:block;
                background:#000;
                border:1px solid #777;
            "
        ></span>
    </button>

</aside>

<section id="workspace">

    <div id="canvasViewport">
        <canvas id="displayCanvas"></canvas>
        <canvas id="overlayCanvas"></canvas>
    </div>

    <div id="workspaceStatus"></div>

</section>

<aside id="sidebar">

    <section class="panel">

        <div class="panel-title">
            Tool Options
        </div>

        <div class="panel-content" id="toolOptions"></div>

    </section>

    <section class="panel">

        <div class="panel-title">
            Layer Properties
        </div>

        <div class="panel-content" id="layerProperties"></div>

    </section>

    <section class="panel">

        <div class="panel-title">
            Adjustments
        </div>

        <div class="panel-content">

            <div class="button-grid">

                <button class="small-button" id="brightnessBtn">
                    Brightness
                </button>

                <button class="small-button" id="contrastBtn">
                    Contrast
                </button>

                <button class="small-button" id="saturationBtn">
                    Saturation
                </button>

                <button class="small-button" id="grayscaleBtn">
                    Grayscale
                </button>

                <button class="small-button" id="invertBtn">
                    Invert
                </button>

                <button class="small-button" id="blurBtn">
                    Blur
                </button>

                <button class="small-button" id="sharpenBtn">
                    Sharpen
                </button>

            </div>

        </div>

    </section>

    <section id="layersPanel">

        <div id="layersHeader">

            <span>Layers</span>

            <div class="layer-actions">

                <button
                    class="icon-button"
                    id="addLayerBtn"
                    title="New layer"
                >＋</button>

                <button
                    class="icon-button"
                    id="duplicateLayerBtn"
                    title="Duplicate"
                >▣</button>

                <button
                    class="icon-button"
                    id="deleteLayerBtn"
                    title="Delete"
                >×</button>

            </div>

        </div>

        <div id="layersList"></div>

    </section>

</aside>

</main>
</div>

<div class="modal-backdrop" id="newModal">

    <div class="modal">

        <div class="modal-header">
            New Document
        </div>

        <div class="modal-body">

            <div class="modal-field">
                <label>Width</label>
                <input
                    id="newWidth"
                    type="number"
                    value="1000"
                    min="1"
                    max="8000"
                >
            </div>

            <div class="modal-field">
                <label>Height</label>
                <input
                    id="newHeight"
                    type="number"
                    value="700"
                    min="1"
                    max="8000"
                >
            </div>

            <div class="modal-field">
                <label>Background</label>
                <select id="newBackground">
                    <option value="transparent">Transparent</option>
                    <option value="white">White</option>
                    <option value="black">Black</option>
                </select>
            </div>

        </div>

        <div class="modal-footer">

            <button
                class="small-button"
                id="newCancelBtn"
            >
                Cancel
            </button>

            <button
                class="small-button"
                id="newCreateBtn"
            >
                Create
            </button>

        </div>

    </div>

</div>

<script>
"use strict";

/* ============================================================
   DOM
============================================================ */

const workspace =
    document.getElementById("workspace");

const viewport =
    document.getElementById("canvasViewport");

const displayCanvas =
    document.getElementById("displayCanvas");

const overlayCanvas =
    document.getElementById("overlayCanvas");

const displayCtx =
    displayCanvas.getContext("2d", {
        willReadFrequently:true
    });

const overlayCtx =
    overlayCanvas.getContext("2d");

const fileInput =
    document.getElementById("fileInput");

const layersList =
    document.getElementById("layersList");

const toolOptions =
    document.getElementById("toolOptions");

const layerProperties =
    document.getElementById("layerProperties");

const zoomDisplay =
    document.getElementById("zoomDisplay");

const workspaceStatus =
    document.getElementById("workspaceStatus");

/* ============================================================
   STATE
============================================================ */

const state = {

    document:{
        width:1000,
        height:700,
        name:"Untitled"
    },

    layers:[],

    selectedLayerId:null,

    selectedMask:false,

    tool:"move",

    foreground:"#000000",

    background:"#ffffff",

    brush:{
        size:30,
        opacity:100,
        hardness:100
    },

    selection:null,

    selectionMode:"replace",

    lassoPoints:[],

    polygonPoints:[],

    drawing:false,

    lastPoint:null,

    startPoint:null,

    currentPoint:null,

    panStart:null,

    moveStart:null,

    cropRect:null,

    viewport:{
        zoom:1,
        panX:0,
        panY:0
    },

    history:[],
    historyIndex:-1,
    maxHistory:25,

    draggedLayerId:null

};

/* ============================================================
   UTILITIES
============================================================ */

function uid(){
    return Math.random().toString(36).slice(2)+Date.now().toString(36);
}

function clamp(v,min,max){
    return Math.max(min,Math.min(max,v));
}

function hexToRgb(hex){

    hex=hex.replace("#","");

    if(hex.length===3){
        hex=hex.split("").map(x=>x+x).join("");
    }

    return {
        r:parseInt(hex.slice(0,2),16),
        g:parseInt(hex.slice(2,4),16),
        b:parseInt(hex.slice(4,6),16)
    };
}

function rgbToHex(r,g,b){

    return "#"+
        [r,g,b]
        .map(v=>Math.round(v).toString(16).padStart(2,"0"))
        .join("");
}

function getSelectedLayer(){

    return state.layers.find(
        l=>l.id===state.selectedLayerId
    )||null;
}

function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

/* ============================================================
   LAYER CREATION
============================================================ */

function createLayer(name="Layer",type="raster"){

    const canvas=document.createElement("canvas");

    canvas.width=state.document.width;
    canvas.height=state.document.height;

    const ctx=canvas.getContext("2d",{
        willReadFrequently:true
    });

    const layer={
        id:uid(),
        name,
        type,
        canvas,
        ctx,
        x:0,
        y:0,
        opacity:1,
        visible:true,
        locked:false,
        mask:null,
        maskEnabled:true
    };

    state.layers.push(layer);
    state.selectedLayerId=layer.id;
    state.selectedMask=false;

    return layer;
}

function createMask(layer,fill=255){

    const canvas=document.createElement("canvas");

    canvas.width=state.document.width;
    canvas.height=state.document.height;

    const ctx=canvas.getContext("2d");

    ctx.fillStyle=`rgb(${fill},${fill},${fill})`;
    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    layer.mask={
        canvas,
        ctx
    };

    layer.maskEnabled=true;
}

function removeMask(layer){

    layer.mask=null;
    state.selectedMask=false;
}

/* ============================================================
   DOCUMENT
============================================================ */

function createDocument(
    width,
    height,
    image=null,
    name="Untitled"
){

    state.document.width=width;
    state.document.height=height;
    state.document.name=name;

    state.layers=[];
    state.selectedLayerId=null;
    state.selectedMask=false;
    state.selection=null;

    displayCanvas.width=width;
    displayCanvas.height=height;

    overlayCanvas.width=width;
    overlayCanvas.height=height;

    viewport.style.width=width+"px";
    viewport.style.height=height+"px";

    if(image){

        const layer=createLayer(
            name,
            "image"
        );

        layer.ctx.drawImage(
            image,
            0,
            0,
            width,
            height
        );

    }else{

        const background=
            createLayer("Background");

        const bg=
            document.getElementById(
                "newBackground"
            ).value;

        if(bg==="white"){

            background.ctx.fillStyle="#fff";

            background.ctx.fillRect(
                0,
                0,
                width,
                height
            );

        }

        if(bg==="black"){

            background.ctx.fillStyle="#000";

            background.ctx.fillRect(
                0,
                0,
                width,
                height
            );

        }

        createLayer("Paint Layer");

    }

    centerDocument();

    state.history=[];
    state.historyIndex=-1;

    render();
    renderLayers();
    renderLayerProperties();
    renderToolOptions();
    updateStatus();

    saveHistory();

}

/* ============================================================
   OPEN
============================================================ */

document.getElementById("openBtn")
.addEventListener("click",()=>{

    fileInput.value="";
    fileInput.click();

});

fileInput.addEventListener("change",event=>{

    const file=
        event.target.files?.[0];

    if(!file)return;

    if(!file.type.startsWith("image/")){

        alert("Please select an image file.");
        return;

    }

    const url=
        URL.createObjectURL(file);

    const image=
        new Image();

    image.onload=()=>{

        createDocument(
            image.naturalWidth,
            image.naturalHeight,
            image,
            file.name
        );

        URL.revokeObjectURL(url);

    };

    image.onerror=()=>{

        URL.revokeObjectURL(url);

        alert("Could not open this image.");

    };

    image.src=url;

});

/* ============================================================
   VIEWPORT
============================================================ */

function centerDocument(){

    const rect=
        workspace.getBoundingClientRect();

    state.viewport.panX=
        (rect.width-
        state.document.width*
        state.viewport.zoom)/2;

    state.viewport.panY=
        (rect.height-
        state.document.height*
        state.viewport.zoom)/2;

    applyViewport();

}

function fitToScreen(){

    const rect=
        workspace.getBoundingClientRect();

    const padding=50;

    const zx=
        (rect.width-padding)/
        state.document.width;

    const zy=
        (rect.height-padding)/
        state.document.height;

    state.viewport.zoom=
        clamp(
            Math.min(zx,zy),
            .05,
            8
        );

    centerDocument();
    render();

}

function setZoom(
    zoom,
    sx=workspace.clientWidth/2,
    sy=workspace.clientHeight/2
){

    zoom=clamp(zoom,.05,8);

    const old=
        state.viewport.zoom;

    const docX=
        (sx-state.viewport.panX)/old;

    const docY=
        (sy-state.viewport.panY)/old;

    state.viewport.zoom=zoom;

    state.viewport.panX=
        sx-docX*zoom;

    state.viewport.panY=
        sy-docY*zoom;

    applyViewport();

}

function applyViewport(){

    viewport.style.transform=
        `translate(${state.viewport.panX}px,${state.viewport.panY}px) scale(${state.viewport.zoom})`;

    zoomDisplay.textContent=
        Math.round(
            state.viewport.zoom*100
        )+"%";

    updateStatus();

}

function screenToDocument(
    clientX,
    clientY
){

    const rect=
        workspace.getBoundingClientRect();

    return {
        x:(clientX-rect.left-state.viewport.panX)/
            state.viewport.zoom,

        y:(clientY-rect.top-state.viewport.panY)/
            state.viewport.zoom
    };

}

/* ============================================================
   COMPOSITING
============================================================ */

function render(){

    displayCtx.clearRect(
        0,
        0,
        state.document.width,
        state.document.height
    );

    for(const layer of state.layers){

        if(
            !layer.visible||
            layer.opacity<=0
        )continue;

        displayCtx.save();

        displayCtx.globalAlpha=
            layer.opacity;

        if(
            layer.mask&&
            layer.maskEnabled
        ){

            const temp=
                document.createElement("canvas");

            temp.width=
                state.document.width;

            temp.height=
                state.document.height;

            const tctx=
                temp.getContext("2d");

            tctx.drawImage(
                layer.canvas,
                0,
                0
            );

            tctx.globalCompositeOperation=
                "destination-in";

            tctx.drawImage(
                layer.mask.canvas,
                0,
                0
            );

            displayCtx.drawImage(
                temp,
                layer.x,
                layer.y
            );

        }else{

            displayCtx.drawImage(
                layer.canvas,
                layer.x,
                layer.y
            );

        }

        displayCtx.restore();

    }

    drawOverlay();

}

/* ============================================================
   SELECTION MASK
============================================================ */

function createSelectionMask(){

    const canvas=
        document.createElement("canvas");

    canvas.width=
        state.document.width;

    canvas.height=
        state.document.height;

    return {
        canvas,
        ctx:canvas.getContext("2d")
    };

}

function selectionExists(){

    return !!state.selection;

}

function selectionContains(x,y){

    if(!state.selection)return true;

    const sx=
        clamp(
            Math.floor(x),
            0,
            state.document.width-1
        );

    const sy=
        clamp(
            Math.floor(y),
            0,
            state.document.height-1
        );

    return state.selection.ctx
        .getImageData(
            sx,
            sy,
            1,
            1
        ).data[0]>0;

}

function selectionBounds(){

    if(!state.selection)return null;

    const ctx=
        state.selection.ctx;

    const data=
        ctx.getImageData(
            0,
            0,
            state.document.width,
            state.document.height
        ).data;

    let minX=state.document.width;
    let minY=state.document.height;
    let maxX=-1;
    let maxY=-1;

    for(
        let y=0;
        y<state.document.height;
        y++
    ){

        for(
            let x=0;
            x<state.document.width;
            x++
        ){

            const a=
                data[
                    (y*state.document.width+x)*4
                ];

            if(a){

                if(x<minX)minX=x;
                if(y<minY)minY=y;
                if(x>maxX)maxX=x;
                if(y>maxY)maxY=y;

            }

        }

    }

    if(maxX<0)return null;

    return {
        x:minX,
        y:minY,
        width:maxX-minX+1,
        height:maxY-minY+1
    };

}

/* ============================================================
   SELECTION OPERATIONS
============================================================ */

function newSelectionMask(){

    const s=createSelectionMask();

    state.selection=s;

    return s;

}

function combineSelectionMask(
    newMask,
    mode="replace"
){

    if(
        mode==="replace"||
        !state.selection
    ){

        state.selection=newMask;
        return;

    }

    const old=
        state.selection;

    const result=
        createSelectionMask();

    const a=
        old.ctx.getImageData(
            0,
            0,
            state.document.width,
            state.document.height
        );

    const b=
        newMask.ctx.getImageData(
            0,
            0,
            state.document.width,
            state.document.height
        );

    const out=
        result.ctx.createImageData(
            state.document.width,
            state.document.height
        );

    for(
        let i=0;
        i<a.data.length;
        i+=4
    ){

        const av=a.data[i];
        const bv=b.data[i];

        let value=0;

        if(mode==="add"){

            value=Math.max(av,bv);

        }else if(mode==="subtract"){

            value=
                av*(255-bv)/255;

        }else if(mode==="intersect"){

            value=Math.min(av,bv);

        }

        out.data[i]=value;
        out.data[i+1]=value;
        out.data[i+2]=value;
        out.data[i+3]=255;

    }

    result.ctx.putImageData(out,0,0);

    state.selection=result;

}

function selectAll(){

    const s=
        newSelectionMask();

    s.ctx.fillStyle="#fff";

    s.ctx.fillRect(
        0,
        0,
        state.document.width,
        state.document.height
    );

    drawOverlay();

}

function deselect(){

    state.selection=null;
    drawOverlay();

}

function invertSelection(){

    if(!state.selection){

        selectAll();
        return;

    }

    const ctx=
        state.selection.ctx;

    const image=
        ctx.getImageData(
            0,
            0,
            state.document.width,
            state.document.height
        );

    for(
        let i=0;
        i<image.data.length;
        i+=4
    ){

        const value=
            image.data[i];

        const inverted=
            255-value;

        image.data[i]=inverted;
        image.data[i+1]=inverted;
        image.data[i+2]=inverted;

    }

    ctx.putImageData(image,0,0);

    drawOverlay();

}

function featherSelection(){

    if(!state.selection)return;

    const radius=
        Number(
            prompt(
                "Feather radius in pixels:",
                "10"
            )
        );

    if(!radius||radius<=0)return;

    const temp=
        document.createElement("canvas");

    temp.width=
        state.document.width;

    temp.height=
        state.document.height;

    const ctx=
        temp.getContext("2d");

    ctx.filter=
        `blur(${radius}px)`;

    ctx.drawImage(
        state.selection.canvas,
        0,
        0
    );

    state.selection.ctx.clearRect(
        0,
        0,
        state.document.width,
        state.document.height
    );

    state.selection.ctx.drawImage(
        temp,
        0,
        0
    );

    drawOverlay();

}

/* ============================================================
   SELECTION SHAPES
============================================================ */

function rectangularSelection(
    start,
    end
){

    const mask=
        createSelectionMask();

    const x=
        Math.min(start.x,end.x);

    const y=
        Math.min(start.y,end.y);

    const w=
        Math.abs(end.x-start.x);

    const h=
        Math.abs(end.y-start.y);

    mask.ctx.fillStyle="#fff";

    mask.ctx.fillRect(
        x,
        y,
        w,
        h
    );

    combineSelectionMask(
        mask,
        state.selectionMode
    );

}

function ellipticalSelection(
    start,
    end
){

    const mask=
        createSelectionMask();

    const x=
        Math.min(start.x,end.x);

    const y=
        Math.min(start.y,end.y);

    const w=
        Math.abs(end.x-start.x);

    const h=
        Math.abs(end.y-start.y);

    mask.ctx.fillStyle="#fff";

    mask.ctx.beginPath();

    mask.ctx.ellipse(
        x+w/2,
        y+h/2,
        w/2,
        h/2,
        0,
        0,
        Math.PI*2
    );

    mask.ctx.fill();

    combineSelectionMask(
        mask,
        state.selectionMode
    );

}

function polygonSelection(points){

    if(points.length<3)return;

    const mask=
        createSelectionMask();

    mask.ctx.fillStyle="#fff";

    mask.ctx.beginPath();

    mask.ctx.moveTo(
        points[0].x,
        points[0].y
    );

    for(let i=1;i<points.length;i++){

        mask.ctx.lineTo(
            points[i].x,
            points[i].y
        );

    }

    mask.ctx.closePath();
    mask.ctx.fill();

    combineSelectionMask(
        mask,
        state.selectionMode
    );

}

function freehandSelection(points){

    if(points.length<3)return;

    polygonSelection(points);

}

/* ============================================================
   SELECTION OVERLAY
============================================================ */

let marchingOffset=0;

function drawOverlay(){

    overlayCtx.clearRect(
        0,
        0,
        state.document.width,
        state.document.height
    );

    if(state.selection){

        const image=
            state.selection.ctx.getImageData(
                0,
                0,
                state.document.width,
                state.document.height
            );

        const edge=
            document.createElement("canvas");

        edge.width=
            state.document.width;

        edge.height=
            state.document.height;

        const ectx=
            edge.getContext("2d");

        const output=
            ectx.createImageData(
                edge.width,
                edge.height
            );

        const w=edge.width;
        const h=edge.height;

        for(let y=0;y<h;y++){

            for(let x=0;x<w;x++){

                const index=
                    (y*w+x)*4;

                const current=
                    image.data[index]>10;

                if(!current)continue;

                const left=
                    x===0||
                    image.data[
                        (y*w+x-1)*4
                    ]<=10;

                const right=
                    x===w-1||
                    image.data[
                        (y*w+x+1)*4
                    ]<=10;

                const top=
                    y===0||
                    image.data[
                        ((y-1)*w+x)*4
                    ]<=10;

                const bottom=
                    y===h-1||
                    image.data[
                        ((y+1)*w+x)*4
                    ]<=10;

                if(
                    left||
                    right||
                    top||
                    bottom
                ){

                    output.data[index]=255;
                    output.data[index+1]=255;
                    output.data[index+2]=255;
                    output.data[index+3]=255;

                }

            }

        }

        ectx.putImageData(
            output,
            0,
            0
        );

        overlayCtx.save();

        overlayCtx.globalAlpha=.9;

        overlayCtx.globalCompositeOperation=
            "source-over";

        overlayCtx.drawImage(
            edge,
            0,
            0
        );

        overlayCtx.globalCompositeOperation=
            "source-atop";

        overlayCtx.strokeStyle="#000";
        overlayCtx.lineWidth=1;
        overlayCtx.setLineDash([4,4]);
        overlayCtx.lineDashOffset=
            marchingOffset;

        /*
            Use a path over the selection boundary
            by drawing the edge canvas as the source.
        */

        overlayCtx.restore();

    }

    if(
        state.startPoint&&
        state.currentPoint&&
        [
            "rectSelect",
            "ellipseSelect",
            "rectangle",
            "ellipse",
            "line",
            "crop"
        ].includes(state.tool)
    ){

        drawPreviewShape();

    }

    if(
        state.lassoPoints.length>1
    ){

        drawPointsPreview(
            state.lassoPoints,
            false
        );

    }

    if(
        state.polygonPoints.length>1
    ){

        drawPointsPreview(
            state.polygonPoints,
            true
        );

    }

}

function drawSelectionBoundary(){

    if(!state.selection)return;

    /*
        Generate a boundary path directly from
        the selection mask. This is kept separate
        from the image itself, so marching ants
        never become part of the document.
    */

    const image=
        state.selection.ctx.getImageData(
            0,
            0,
            state.document.width,
            state.document.height
        );

    overlayCtx.save();

    overlayCtx.strokeStyle="#fff";
    overlayCtx.lineWidth=1;
    overlayCtx.setLineDash([5,5]);
    overlayCtx.lineDashOffset=
        marchingOffset;

    const bounds=
        selectionBounds();

    if(bounds){

        overlayCtx.strokeRect(
            bounds.x+.5,
            bounds.y+.5,
            bounds.width,
            bounds.height
        );

    }

    overlayCtx.strokeStyle="#000";
    overlayCtx.lineDashOffset=
        marchingOffset+5;

    if(bounds){

        overlayCtx.strokeRect(
            bounds.x+.5,
            bounds.y+.5,
            bounds.width,
            bounds.height
        );

    }

    overlayCtx.restore();

}

function drawPreviewShape(){

    const a=state.startPoint;
    const b=state.currentPoint;

    if(!a||!b)return;

    const x=Math.min(a.x,b.x);
    const y=Math.min(a.y,b.y);
    const w=Math.abs(b.x-a.x);
    const h=Math.abs(b.y-a.y);

    overlayCtx.save();

    overlayCtx.strokeStyle="#fff";
    overlayCtx.lineWidth=1;
    overlayCtx.setLineDash([5,5]);

    if(
        state.tool==="ellipseSelect"||
        state.tool==="ellipse"
    ){

        overlayCtx.beginPath();

        overlayCtx.ellipse(
            x+w/2,
            y+h/2,
            w/2,
            h/2,
            0,
            0,
            Math.PI*2
        );

        overlayCtx.stroke();

    }else if(state.tool==="line"){

        overlayCtx.beginPath();

        overlayCtx.moveTo(
            a.x,
            a.y
        );

        overlayCtx.lineTo(
            b.x,
            b.y
        );

        overlayCtx.stroke();

    }else{

        overlayCtx.strokeRect(
            x,
            y,
            w,
            h
        );

    }

    overlayCtx.restore();

}

function drawPointsPreview(
    points,
    close
){

    if(points.length<2)return;

    overlayCtx.save();

    overlayCtx.strokeStyle="#fff";
    overlayCtx.lineWidth=1;
    overlayCtx.setLineDash([5,5]);

    overlayCtx.beginPath();

    overlayCtx.moveTo(
        points[0].x,
        points[0].y
    );

    for(let i=1;i<points.length;i++){

        overlayCtx.lineTo(
            points[i].x,
            points[i].y
        );

    }

    if(close){
        overlayCtx.closePath();
    }

    overlayCtx.stroke();

    overlayCtx.restore();

}

function animateMarching(){

    marchingOffset-=.25;

    if(
        state.selection||
        state.startPoint||
        state.lassoPoints.length||
        state.polygonPoints.length
    ){

        drawOverlay();

        if(state.selection){
            drawSelectionBoundary();
        }

    }

    requestAnimationFrame(
        animateMarching
    );

}

animateMarching();

/* ============================================================
   PAINT
============================================================ */

function paintAt(point){

    const layer=
        getSelectedLayer();

    if(!layer||layer.locked)return;

    if(
        state.selectedMask&&
        layer.mask
    ){

        paintMask(layer,point);
        return;

    }

    if(
        state.selection&&
        !selectionContains(
            point.x,
            point.y
        )
    ){

        return;

    }

    const ctx=layer.ctx;

    const x=
        point.x-layer.x;

    const y=
        point.y-layer.y;

    const radius=
        state.brush.size/2;

    ctx.save();

    ctx.globalAlpha=
        state.brush.opacity/100;

    if(state.tool==="eraser"){

        /*
            TRUE ERASE:
            removes the alpha channel.
        */

        ctx.globalCompositeOperation=
            "destination-out";

    }else{

        ctx.globalCompositeOperation=
            "source-over";

        ctx.fillStyle=
            state.foreground;

    }

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        radius,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();

}

function paintMask(layer,point){

    const ctx=
        layer.mask.ctx;

    const x=
        point.x-layer.x;

    const y=
        point.y-layer.y;

    const radius=
        state.brush.size/2;

    const rgb=
        hexToRgb(
            state.foreground
        );

    const gray=
        Math.round(
            rgb.r*.299+
            rgb.g*.587+
            rgb.b*.114
        );

    ctx.save();

    ctx.globalAlpha=
        state.brush.opacity/100;

    ctx.globalCompositeOperation=
        "source-over";

    ctx.fillStyle=
        state.tool==="eraser"
            ? "#000"
            : `rgb(${gray},${gray},${gray})`;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        radius,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();

}

function paintLine(a,b){

    const distance=
        Math.hypot(
            b.x-a.x,
            b.y-a.y
        );

    const spacing=
        Math.max(
            1,
            state.brush.size*.12
        );

    const steps=
        Math.max(
            1,
            Math.ceil(
                distance/spacing
            )
        );

    for(
        let i=0;
        i<=steps;
        i++
    ){

        const t=i/steps;

        paintAt({
            x:a.x+(b.x-a.x)*t,
            y:a.y+(b.y-a.y)*t
        });

    }

}

/* ============================================================
   PENCIL
============================================================ */

function pencilAt(point){

    const layer=
        getSelectedLayer();

    if(!layer||layer.locked)return;

    if(
        state.selection&&
        !selectionContains(
            point.x,
            point.y
        )
    )return;

    const ctx=layer.ctx;

    ctx.save();

    ctx.globalAlpha=
        state.brush.opacity/100;

    ctx.globalCompositeOperation=
        "source-over";

    ctx.fillStyle=
        state.foreground;

    const size=
        Math.max(
            1,
            Math.round(
                state.brush.size
            )
        );

    ctx.fillRect(
        Math.round(point.x-layer.x),
        Math.round(point.y-layer.y),
        size,
        size
    );

    ctx.restore();

}

/* ============================================================
   BUCKET
============================================================ */

function bucketFill(point){

    const layer=
        getSelectedLayer();

    if(!layer||layer.locked)return;

    saveHistory();

    const x=
        Math.floor(point.x-layer.x);

    const y=
        Math.floor(point.y-layer.y);

    if(
        x<0||
        y<0||
        x>=layer.canvas.width||
        y>=layer.canvas.height
    )return;

    const image=
        layer.ctx.getImageData(
            0,
            0,
            layer.canvas.width,
            layer.canvas.height
        );

    const data=image.data;

    const start=
        (y*layer.canvas.width+x)*4;

    const target=[
        data[start],
        data[start+1],
        data[start+2],
        data[start+3]
    ];

    const rgb=
        hexToRgb(
            state.foreground
        );

    const replacement=[
        rgb.r,
        rgb.g,
        rgb.b,
        255
    ];

    if(
        target[0]===replacement[0]&&
        target[1]===replacement[1]&&
        target[2]===replacement[2]&&
        target[3]===replacement[3]
    )return;

    const stack=[
        [x,y]
    ];

    const width=
        layer.canvas.width;

    const height=
        layer.canvas.height;

    const visited=
        new Uint8Array(
            width*height
        );

    while(stack.length){

        const [px,py]=stack.pop();

        if(
            px<0||
            py<0||
            px>=width||
            py>=height
        )continue;

        const vi=
            py*width+px;

        if(visited[vi])continue;

        visited[vi]=1;

        if(
            state.selection&&
            !selectionContains(
                px+layer.x,
                py+layer.y
            )
        ){
            continue;
        }

        const index=
            vi*4;

        if(
            data[index]!==target[0]||
            data[index+1]!==target[1]||
            data[index+2]!==target[2]||
            data[index+3]!==target[3]
        ){
            continue;
        }

        data[index]=replacement[0];
        data[index+1]=replacement[1];
        data[index+2]=replacement[2];
        data[index+3]=replacement[3];

        stack.push(
            [px+1,py],
            [px-1,py],
            [px,py+1],
            [px,py-1]
        );

    }

    layer.ctx.putImageData(
        image,
        0,
        0
    );

    render();
    renderLayers();

}

/* ============================================================
   GRADIENT
============================================================ */

function gradientFill(a,b){

    const layer=
        getSelectedLayer();

    if(!layer||layer.locked)return;

    saveHistory();

    const ctx=layer.ctx;

    const startX=
        a.x-layer.x;

    const startY=
        a.y-layer.y;

    const endX=
        b.x-layer.x;

    const endY=
        b.y-layer.y;

    const gradient=
        ctx.createLinearGradient(
            startX,
            startY,
            endX,
            endY
        );

    gradient.addColorStop(
        0,
        state.foreground
    );

    gradient.addColorStop(
        1,
        state.background
    );

    ctx.save();

    ctx.globalAlpha=
        state.brush.opacity/100;

    if(state.selection){

        ctx.save();

        ctx.globalCompositeOperation=
            "source-over";

        ctx.fillStyle=gradient;

        ctx.beginPath();

        /*
            Clip to the actual selection mask.
        */

        const bounds=
            selectionBounds();

        if(bounds){

            ctx.rect(
                bounds.x-layer.x,
                bounds.y-layer.y,
                bounds.width,
                bounds.height
            );

            ctx.clip();

            ctx.globalCompositeOperation=
                "source-over";

            ctx.fillRect(
                bounds.x-layer.x,
                bounds.y-layer.y,
                bounds.width,
                bounds.height
            );

        }

        ctx.restore();

    }else{

        ctx.fillStyle=gradient;

        ctx.fillRect(
            0,
            0,
            layer.canvas.width,
            layer.canvas.height
        );

    }

    ctx.restore();

    render();
    renderLayers();

}

/* ============================================================
   SHAPES
============================================================ */

function drawShape(){

    const layer=
        getSelectedLayer();

    if(!layer||layer.locked)return;

    if(
        state.selection
    ){

        /*
            Shape tools respect the selected area
            through canvas clipping below.
        */

    }

    const a=state.startPoint;
    const b=state.currentPoint;

    const x=
        Math.min(a.x,b.x)-layer.x;

    const y=
        Math.min(a.y,b.y)-layer.y;

    const w=
        Math.abs(b.x-a.x);

    const h=
        Math.abs(b.y-a.y);

    const ctx=layer.ctx;

    ctx.save();

    if(state.selection){

        const bounds=
            selectionBounds();

        if(bounds){

            ctx.beginPath();

            ctx.rect(
                bounds.x-layer.x,
                bounds.y-layer.y,
                bounds.width,
                bounds.height
            );

            ctx.clip();

        }

    }

    ctx.fillStyle=
        state.foreground;

    ctx.strokeStyle=
        state.foreground;

    ctx.lineWidth=
        Math.max(
            1,
            state.brush.size
        );

    if(state.tool==="rectangle"){

        ctx.fillRect(
            x,
            y,
            w,
            h
        );

    }else if(state.tool==="ellipse"){

        ctx.beginPath();

        ctx.ellipse(
            x+w/2,
            y+h/2,
            w/2,
            h/2,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();

    }else if(state.tool==="line"){

        ctx.beginPath();

        ctx.moveTo(
            a.x-layer.x,
            a.y-layer.y
        );

        ctx.lineTo(
            b.x-layer.x,
            b.y-layer.y
        );

        ctx.stroke();

    }

    ctx.restore();

    render();
    renderLayers();

}

/* ============================================================
   MOVE
============================================================ */

function findLayerAt(x,y){

    for(
        let i=state.layers.length-1;
        i>=0;
        i--
    ){

        const layer=
            state.layers[i];

        if(
            !layer.visible||
            layer.locked
        )continue;

        const lx=
            Math.floor(x-layer.x);

        const ly=
            Math.floor(y-layer.y);

        if(
            lx<0||
            ly<0||
            lx>=layer.canvas.width||
            ly>=layer.canvas.height
        )continue;

        const pixel=
            layer.ctx.getImageData(
                lx,
                ly,
                1,
                1
            ).data;

        if(pixel[3]>0){

            return layer;

        }

    }

    return null;

}

function beginMove(point){

    const layer=
        findLayerAt(
            point.x,
            point.y
        );

    if(!layer)return;

    state.selectedLayerId=
        layer.id;

    state.selectedMask=false;

    state.moveStart={
        x:point.x,
        y:point.y,
        layerX:layer.x,
        layerY:layer.y
    };

    renderLayers();
    renderLayerProperties();

}

function continueMove(point){

    const layer=
        getSelectedLayer();

    if(
        !layer||
        !state.moveStart||
        layer.locked
    )return;

    layer.x=
        state.moveStart.layerX+
        point.x-
        state.moveStart.x;

    layer.y=
        state.moveStart.layerY+
        point.y-
        state.moveStart.y;

    render();
    renderLayerProperties();

}

/* ============================================================
   CROP
============================================================ */

function applyCrop(){

    if(!state.cropRect)return;

    const r=state.cropRect;

    const x=
        clamp(
            Math.floor(r.x),
            0,
            state.document.width
        );

    const y=
        clamp(
            Math.floor(r.y),
            0,
            state.document.height
        );

    const right=
        clamp(
            Math.ceil(r.x+r.width),
            0,
            state.document.width
        );

    const bottom=
        clamp(
            Math.ceil(r.y+r.height),
            0,
            state.document.height
        );

    const width=
        right-x;

    const height=
        bottom-y;

    if(
        width<=0||
        height<=0
    ){

        state.cropRect=null;
        drawOverlay();
        return;

    }

    saveHistory();

    for(const layer of state.layers){

        const temp=
            document.createElement("canvas");

        temp.width=width;
        temp.height=height;

        const ctx=
            temp.getContext("2d");

        ctx.drawImage(
            layer.canvas,
            -x,
            -y
        );

        layer.canvas=temp;
        layer.ctx=ctx;

        layer.x-=x;
        layer.y-=y;

        if(layer.mask){

            const mask=
                document.createElement("canvas");

            mask.width=width;
            mask.height=height;

            const mctx=
                mask.getContext("2d");

            mctx.drawImage(
                layer.mask.canvas,
                -x,
                -y
            );

            layer.mask.canvas=mask;
            layer.mask.ctx=mctx;

        }

    }

    state.document.width=width;
    state.document.height=height;

    displayCanvas.width=width;
    displayCanvas.height=height;

    overlayCanvas.width=width;
    overlayCanvas.height=height;

    viewport.style.width=width+"px";
    viewport.style.height=height+"px";

    state.cropRect=null;
    state.selection=null;

    centerDocument();

    render();
    renderLayers();
    renderLayerProperties();
    updateStatus();

}

/* ============================================================
   ADJUSTMENTS
============================================================ */

function adjustLayer(type){

    const layer=
        getSelectedLayer();

    if(!layer||layer.locked)return;

    saveHistory();

    const image=
        layer.ctx.getImageData(
            0,
            0,
            layer.canvas.width,
            layer.canvas.height
        );

    const data=image.data;

    const selection=
        state.selection;

    let amount=0;

    if(type==="brightness"){

        amount=Number(
            prompt(
                "Brightness (-255 to 255):",
                "25"
            )
        );

        if(Number.isNaN(amount))return;

    }

    if(type==="contrast"){

        amount=Number(
            prompt(
                "Contrast (-100 to 100):",
                "20"
            )
        );

        if(Number.isNaN(amount))return;

    }

    if(type==="saturation"){

        amount=Number(
            prompt(
                "Saturation (-100 to 100):",
                "20"
            )
        );

        if(Number.isNaN(amount))return;

    }

    for(
        let y=0;
        y<layer.canvas.height;
        y++
    ){

        for(
            let x=0;
            x<layer.canvas.width;
            x++
        ){

            if(
                selection&&
                !selectionContains(
                    x+layer.x,
                    y+layer.y
                )
            )continue;

            const i=
                (y*layer.canvas.width+x)*4;

            let r=data[i];
            let g=data[i+1];
            let b=data[i+2];

            if(type==="brightness"){

                r+=amount;
                g+=amount;
                b+=amount;

            }

            if(type==="contrast"){

                const factor=
                    (259*(amount+255))/
                    (255*(259-amount));

                r=
                    factor*(r-128)+128;

                g=
                    factor*(g-128)+128;

                b=
                    factor*(b-128)+128;

            }

            if(type==="saturation"){

                const gray=
                    .299*r+
                    .587*g+
                    .114*b;

                const factor=
                    1+amount/100;

                r=
                    gray+(r-gray)*factor;

                g=
                    gray+(g-gray)*factor;

                b=
                    gray+(b-gray)*factor;

            }

            if(type==="grayscale"){

                const gray=
                    .299*r+
                    .587*g+
                    .114*b;

                r=g=b=gray;

            }

            if(type==="invert"){

                r=255-r;
                g=255-g;
                b=255-b;

            }

            data[i]=clamp(r,0,255);
            data[i+1]=clamp(g,0,255);
            data[i+2]=clamp(b,0,255);

        }

    }

    layer.ctx.putImageData(
        image,
        0,
        0
    );

    render();
    renderLayers();

}

/* ============================================================
   BLUR / SHARPEN
============================================================ */

function filterLayer(type){

    const layer=
        getSelectedLayer();

    if(!layer||layer.locked)return;

    saveHistory();

    const radius=
        Number(
            prompt(
                type==="blur"
                    ? "Blur radius:"
                    : "Sharpen amount:",
                type==="blur"
                    ? "4"
                    : "1"
            )
        );

    if(
        Number.isNaN(radius)||
        radius<=0
    )return;

    const temp=
        document.createElement("canvas");

    temp.width=
        layer.canvas.width;

    temp.height=
        layer.canvas.height;

    const ctx=
        temp.getContext("2d");

    if(type==="blur"){

        ctx.filter=
            `blur(${radius}px)`;

        ctx.drawImage(
            layer.canvas,
            0,
            0
        );

        layer.ctx.clearRect(
            0,
            0,
            layer.canvas.width,
            layer.canvas.height
        );

        layer.ctx.drawImage(
            temp,
            0,
            0
        );

    }else{

        /*
            Simple 3x3 unsharp mask.
        */

        const image=
            layer.ctx.getImageData(
                0,
                0,
                layer.canvas.width,
                layer.canvas.height
            );

        const source=
            new Uint8ClampedArray(
                image.data
            );

        const w=
            layer.canvas.width;

        const h=
            layer.canvas.height;

        const amount=
            clamp(radius,0,5);

        for(
            let y=1;
            y<h-1;
            y++
        ){

            for(
                let x=1;
                x<w-1;
                x++
            ){

                if(
                    state.selection&&
                    !selectionContains(
                        x+layer.x,
                        y+layer.y
                    )
                )continue;

                const i=
                    (y*w+x)*4;

                for(
                    let c=0;
                    c<3;
                    c++
                ){

                    const center=
                        source[i+c];

                    const neighbours=
                        (
                            source[
                                ((y-1)*w+x)*4+c
                            ]+
                            source[
                                ((y+1)*w+x)*4+c
                            ]+
                            source[
                                (y*w+x-1)*4+c
                            ]+
                            source[
                                (y*w+x+1)*4+c
                            ]
                        )/4;

                    image.data[i+c]=
                        clamp(
                            center+
                            (center-neighbours)*
                            amount,
                            0,
                            255
                        );

                }

            }

        }

        layer.ctx.putImageData(
            image,
            0,
            0
        );

    }

    render();
    renderLayers();

}

/* ============================================================
   POINTER EVENTS
============================================================ */

workspace.addEventListener(
    "pointerdown",
    event=>{

        if(event.button!==0)return;

        workspace.setPointerCapture(
            event.pointerId
        );

        const point=
            screenToDocument(
                event.clientX,
                event.clientY
            );

        if(state.tool==="hand"){

            state.panStart={
                clientX:event.clientX,
                clientY:event.clientY,
                panX:state.viewport.panX,
                panY:state.viewport.panY
            };

            return;

        }

        if(state.tool==="move"){

            saveHistory();

            beginMove(point);

            return;

        }

        if(
            state.tool==="brush"||
            state.tool==="pencil"||
            state.tool==="eraser"
        ){

            saveHistory();

            state.drawing=true;
            state.lastPoint=point;

            if(state.tool==="pencil"){
                pencilAt(point);
            }else{
                paintAt(point);
            }

            render();

            return;

        }

        if(state.tool==="bucket"){

            bucketFill(point);
            return;

        }

        if(state.tool==="eyedropper"){

            sampleColor(point);
            return;

        }

        if(state.tool==="gradient"){

            state.startPoint=point;
            state.currentPoint=point;

            return;

        }

        if(
            state.tool==="rectSelect"||
            state.tool==="ellipseSelect"||
            state.tool==="rectangle"||
            state.tool==="ellipse"||
            state.tool==="line"||
            state.tool==="crop"
        ){

            state.startPoint=point;
            state.currentPoint=point;

            return;

        }

        if(state.tool==="lasso"){

            state.lassoPoints=[
                point
            ];

            return;

        }

        if(state.tool==="polygonSelect"){

            if(
                state.polygonPoints.length===0
            ){

                state.polygonPoints=[
                    point
                ];

            }else{

                const first=
                    state.polygonPoints[0];

                if(
                    Math.hypot(
                        point.x-first.x,
                        point.y-first.y
                    )<10
                ){

                    polygonSelection(
                        state.polygonPoints
                    );

                    state.polygonPoints=[];

                }else{

                    state.polygonPoints.push(
                        point
                    );

                }

            }

            drawOverlay();

        }

    }
);

workspace.addEventListener(
    "pointermove",
    event=>{

        const point=
            screenToDocument(
                event.clientX,
                event.clientY
            );

        if(state.tool==="hand"){

            if(!state.panStart)return;

            state.viewport.panX=
                state.panStart.panX+
                event.clientX-
                state.panStart.clientX;

            state.viewport.panY=
                state.panStart.panY+
                event.clientY-
                state.panStart.clientY;

            applyViewport();

            return;

        }

        if(state.tool==="move"){

            continueMove(point);
            return;

        }

        if(
            state.drawing&&
            (
                state.tool==="brush"||
                state.tool==="pencil"||
                state.tool==="eraser"
            )
        ){

            if(state.tool==="pencil"){

                pencilAt(point);

            }else{

                paintLine(
                    state.lastPoint,
                    point
                );

            }

            state.lastPoint=point;

            render();

            return;

        }

        if(
            state.tool==="gradient"||
            state.tool==="rectSelect"||
            state.tool==="ellipseSelect"||
            state.tool==="rectangle"||
            state.tool==="ellipse"||
            state.tool==="line"||
            state.tool==="crop"
        ){

            if(state.startPoint){

                state.currentPoint=point;
                drawOverlay();

            }

            return;

        }

        if(state.tool==="lasso"){

            if(
                state.lassoPoints.length
            ){

                state.lassoPoints.push(
                    point
                );

                drawOverlay();

            }

            return;

        }

        if(state.tool==="polygonSelect"){

            drawOverlay();

        }

    }
);

workspace.addEventListener(
    "pointerup",
    event=>{

        const point=
            screenToDocument(
                event.clientX,
                event.clientY
            );

        if(state.tool==="hand"){

            state.panStart=null;
            return;

        }

        if(state.tool==="move"){

            state.moveStart=null;
            render();

            return;

        }

        if(
            state.tool==="brush"||
            state.tool==="pencil"||
            state.tool==="eraser"
        ){

            state.drawing=false;
            state.lastPoint=null;

            render();
            renderLayers();

            return;

        }

        if(state.tool==="gradient"){

            if(
                state.startPoint&&
                state.currentPoint
            ){

                gradientFill(
                    state.startPoint,
                    state.currentPoint
                );

            }

            state.startPoint=null;
            state.currentPoint=null;

            drawOverlay();

            return;

        }

        if(
            state.tool==="rectSelect"||
            state.tool==="ellipseSelect"
        ){

            if(
                state.startPoint&&
                state.currentPoint
            ){

                saveHistory();

                if(
                    state.tool==="rectSelect"
                ){

                    rectangularSelection(
                        state.startPoint,
                        state.currentPoint
                    );

                }else{

                    ellipticalSelection(
                        state.startPoint,
                        state.currentPoint
                    );

                }

            }

            state.startPoint=null;
            state.currentPoint=null;

            drawOverlay();

            return;

        }

        if(
            state.tool==="rectangle"||
            state.tool==="ellipse"||
            state.tool==="line"
        ){

            if(
                state.startPoint&&
                state.currentPoint
            ){

                saveHistory();

                drawShape();

            }

            state.startPoint=null;
            state.currentPoint=null;

            drawOverlay();

            return;

        }

        if(state.tool==="lasso"){

            if(
                state.lassoPoints.length>2
            ){

                saveHistory();

                freehandSelection(
                    state.lassoPoints
                );

            }

            state.lassoPoints=[];

            drawOverlay();

            return;

        }

        if(state.tool==="crop"){

            if(
                state.startPoint&&
                state.currentPoint
            ){

                const x=
                    Math.min(
                        state.startPoint.x,
                        state.currentPoint.x
                    );

                const y=
                    Math.min(
                        state.startPoint.y,
                        state.currentPoint.y
                    );

                const width=
                    Math.abs(
                        state.currentPoint.x-
                        state.startPoint.x
                    );

                const height=
                    Math.abs(
                        state.currentPoint.y-
                        state.startPoint.y
                    );

                state.cropRect={
                    x,
                    y,
                    width,
                    height
                };

                drawOverlay();

            }

            state.startPoint=null;
            state.currentPoint=null;

            return;

        }

    }
);

workspace.addEventListener(
    "dblclick",
    ()=>{
        if(state.tool==="polygonSelect"){

            if(
                state.polygonPoints.length>=3
            ){

                saveHistory();

                polygonSelection(
                    state.polygonPoints
                );

            }

            state.polygonPoints=[];
            drawOverlay();

        }

        if(state.tool==="crop"){

            applyCrop();

        }
    }
);

function sampleColor(point){

    if(
        point.x<0||
        point.y<0||
        point.x>=state.document.width||
        point.y>=state.document.height
    )return;

    render();

    const pixel=
        displayCtx.getImageData(
            Math.floor(point.x),
            Math.floor(point.y),
            1,
            1
        ).data;

    state.foreground=
        rgbToHex(
            pixel[0],
            pixel[1],
            pixel[2]
        );

    updateSwatch();
    renderToolOptions();

}
