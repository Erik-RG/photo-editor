            <div class="option-label">Y</div>

            <input
                id="layerY"
                type="number"
                value="${Math.round(layer.y)}"
            >
        </div>

        <div style="height:7px"></div>

        <div class="button-grid">

            <button
                class="small-button"
                id="maskBtn"
            >
                ${layer.mask?"Remove Mask":"Add Mask"}
            </button>

            <button
                class="small-button"
                id="maskToggle"
                ${layer.mask?"":"disabled"}
            >
                ${layer.maskEnabled?"Disable":"Enable"}
            </button>

            <button
                class="small-button"
                id="applyMask"
                ${layer.mask?"":"disabled"}
            >
                Apply Mask
            </button>

            <button
                class="small-button"
                id="lockBtn"
            >
                ${layer.locked?"Unlock":"Lock"}
            </button>

        </div>

        <div style="height:7px"></div>

        <div class="button-grid">

            <button
                class="small-button"
                id="upBtn"
            >
                Move Up
            </button>

            <button
                class="small-button"
                id="downBtn"
            >
                Move Down
            </button>

        </div>
    `;

    document.getElementById(
        "layerName"
    ).onchange=e=>{

        layer.name=
            e.target.value.trim()||
            "Layer";

        renderLayers();

    };

    document.getElementById(
        "layerOpacity"
    ).oninput=e=>{

        layer.opacity=
            Number(e.target.value)/100;

        render();

    };

    document.getElementById(
        "layerX"
    ).onchange=e=>{

        if(layer.locked)return;

        layer.x=
            Number(e.target.value)||0;

        render();

    };

    document.getElementById(
        "layerY"
    ).onchange=e=>{

        if(layer.locked)return;

        layer.y=
            Number(e.target.value)||0;

        render();

    };

    document.getElementById(
        "maskBtn"
    ).onclick=()=>{

        saveHistory();

        if(layer.mask){

            removeMask(layer);

        }else{

            createMask(layer,255);

        }

        render();
        renderLayers();
        renderLayerProperties();

    };

    document.getElementById(
        "maskToggle"
    ).onclick=()=>{

        if(!layer.mask)return;

        layer.maskEnabled=
            !layer.maskEnabled;

        render();
        renderLayerProperties();

    };

    document.getElementById(
        "applyMask"
    ).onclick=()=>{

        if(!layer.mask)return;

        saveHistory();

        const temp=
            document.createElement("canvas");

        temp.width=
            layer.canvas.width;

        temp.height=
            layer.canvas.height;

        const ctx=
            temp.getContext("2d");

        ctx.drawImage(
            layer.canvas,
            0,
            0
        );

        ctx.globalCompositeOperation=
            "destination-in";

        ctx.drawImage(
            layer.mask.canvas,
            0,
            0
        );

        layer.ctx.clearRect(
            0,
            0,
            layer.canvas.width,
            layer.canvas.height
        );

        layer.ctx.drawImage(
            temp,
            0,
            0
        );

        removeMask(layer);

        render();
        renderLayers();
        renderLayerProperties();

    };

    document.getElementById(
        "lockBtn"
    ).onclick=()=>{

        layer.locked=
            !layer.locked;

        renderLayers();
        renderLayerProperties();

    };

    document.getElementById(
        "upBtn"
    ).onclick=()=>{

        moveLayer(
            layer.id,
            1
        );

    };

    document.getElementById(
        "downBtn"
    ).onclick=()=>{

        moveLayer(
            layer.id,
            -1
        );

    };

}

/* ============================================================
   LAYERS
============================================================ */

function renderLayers(){

    layersList.innerHTML="";

    for(
        let i=state.layers.length-1;
        i>=0;
        i--
    ){

        const layer=
            state.layers[i];

        const row=
            document.createElement("div");

        row.className=
            "layer-row"+
            (
                layer.id===
                state.selectedLayerId
                    ?" selected"
                    :""
            );

        row.draggable=true;

        const visibility=
            document.createElement("button");

        visibility.className=
            "layer-visibility";

        visibility.textContent=
            layer.visible?"●":"○";

        visibility.onclick=e=>{

            e.stopPropagation();

            layer.visible=
                !layer.visible;

            render();
            renderLayers();

        };

        const thumb=
            document.createElement("div");

        thumb.className=
            "layer-thumb";

        const canvas=
            document.createElement("canvas");

        canvas.width=38;
        canvas.height=38;

        const ctx=
            canvas.getContext("2d");

        ctx.drawImage(
            layer.canvas,
            0,
            0,
            38,
            38
        );

        thumb.appendChild(canvas);

        const info=
            document.createElement("div");

        info.className=
            "layer-info";

        const name=
            document.createElement("div");

        name.className=
            "layer-name";

        name.textContent=
            layer.name;

        const type=
            document.createElement("div");

        type.className=
            "layer-type";

        type.textContent=
            layer.locked
                ?"Locked"
                :layer.type;

        info.appendChild(name);
        info.appendChild(type);

        const badge=
            document.createElement("div");

        if(layer.mask){

            badge.className=
                "mask-badge";

            badge.textContent="M";

            badge.onclick=e=>{

                e.stopPropagation();

                state.selectedLayerId=
                    layer.id;

                state.selectedMask=true;

                renderLayers();
                renderLayerProperties();
                renderToolOptions();

            };

        }

        row.appendChild(visibility);
        row.appendChild(thumb);
        row.appendChild(info);
        row.appendChild(badge);

        row.onclick=()=>{

            state.selectedLayerId=
                layer.id;

            state.selectedMask=false;

            renderLayers();
            renderLayerProperties();

        };

        row.ondblclick=()=>{

            const input=
                document.createElement("input");

            input.type="text";
            input.value=layer.name;
            input.style.width="100%";

            info.replaceChildren(input);

            input.focus();
            input.select();

            input.onblur=()=>{

                layer.name=
                    input.value.trim()||
                    "Layer";

                renderLayers();

            };

            input.onkeydown=e=>{

                if(e.key==="Enter"){
                    input.blur();
                }

                if(e.key==="Escape"){
                    renderLayers();
                }

            };

        };

        row.ondragstart=e=>{

            state.draggedLayerId=
                layer.id;

            e.dataTransfer.effectAllowed=
                "move";

        };

        row.ondragover=e=>{

            e.preventDefault();

            row.classList.add(
                "drag-over"
            );

        };

        row.ondragleave=()=>{

            row.classList.remove(
                "drag-over"
            );

        };

        row.ondrop=e=>{

            e.preventDefault();

            row.classList.remove(
                "drag-over"
            );

            const dragged=
                state.layers.find(
                    l=>l.id===
                    state.draggedLayerId
                );

            if(!dragged)return;

            const from=
                state.layers.indexOf(
                    dragged
                );

            const to=
                state.layers.indexOf(
                    layer
                );

            state.layers.splice(
                from,
                1
            );

            state.layers.splice(
                to,
                0,
                dragged
            );

            render();
            renderLayers();

        };

        layersList.appendChild(row);

    }

}

function moveLayer(id,direction){

    const index=
        state.layers.findIndex(
            l=>l.id===id
        );

    if(index<0)return;

    const next=
        index+direction;

    if(
        next<0||
        next>=state.layers.length
    )return;

    [
        state.layers[index],
        state.layers[next]
    ]=[
        state.layers[next],
        state.layers[index]
    ];

    render();
    renderLayers();

}

document.getElementById(
    "addLayerBtn"
).onclick=()=>{

    saveHistory();

    createLayer("New Layer");

    render();
    renderLayers();
    renderLayerProperties();

};

document.getElementById(
    "duplicateLayerBtn"
).onclick=()=>{

    const layer=
        getSelectedLayer();

    if(!layer)return;

    saveHistory();

    const copy=
        createLayer(
            layer.name+" copy",
            layer.type
        );

    copy.x=layer.x+10;
    copy.y=layer.y+10;
    copy.opacity=layer.opacity;
    copy.visible=layer.visible;
    copy.locked=layer.locked;

    copy.ctx.drawImage(
        layer.canvas,
        0,
        0
    );

    if(layer.mask){

        createMask(copy,255);

        copy.mask.ctx.drawImage(
            layer.mask.canvas,
            0,
            0
        );

    }

    const oldIndex=
        state.layers.indexOf(layer);

    state.layers.splice(
        state.layers.indexOf(copy),
        1
    );

    state.layers.splice(
        oldIndex+1,
        0,
        copy
    );

    state.selectedLayerId=
        copy.id;

    render();
    renderLayers();
    renderLayerProperties();

};

document.getElementById(
    "deleteLayerBtn"
).onclick=()=>{

    const layer=
        getSelectedLayer();

    if(!layer)return;

    saveHistory();

    const index=
        state.layers.indexOf(layer);

    state.layers.splice(
        index,
        1
    );

    if(state.layers.length){

        state.selectedLayerId=
            state.layers[
                clamp(
                    index-1,
                    0,
                    state.layers.length-1
                )
            ].id;

    }else{

        createLayer("Layer");

    }

    render();
    renderLayers();
    renderLayerProperties();

};

/* ============================================================
   DELETE SELECTION
============================================================ */

function deleteSelectedPixels(){

    const layer=
        getSelectedLayer();

    if(!layer||layer.locked)return;

    saveHistory();

    if(!state.selection){

        layer.ctx.clearRect(
            0,
            0,
            layer.canvas.width,
            layer.canvas.height
        );

    }else{

        layer.ctx.save();

        layer.ctx.globalCompositeOperation=
            "destination-out";

        /*
            A real per-pixel selection mask.
        */

        layer.ctx.drawImage(
            state.selection.canvas,
            0,
            0
        );

        layer.ctx.restore();

    }

    render();
    renderLayers();

}

/* ============================================================
   UNDO / REDO
============================================================ */

function serializeState(){

    return {
        document:{
            ...state.document
        },

        selectedLayerId:
            state.selectedLayerId,

        selectedMask:
            state.selectedMask,

        selection:
            state.selection
                ?state.selection.canvas.toDataURL()
                :null,

        layers:
            state.layers.map(layer=>({

                id:layer.id,
                name:layer.name,
                type:layer.type,
                x:layer.x,
                y:layer.y,
                opacity:layer.opacity,
                visible:layer.visible,
                locked:layer.locked,
                maskEnabled:layer.maskEnabled,

                image:
                    layer.canvas.toDataURL(),

                mask:
                    layer.mask
                        ?layer.mask.canvas.toDataURL()
                        :null

            }))

    };

}

function saveHistory(){

    const snapshot=
        serializeState();

    if(
        state.historyIndex<
        state.history.length-1
    ){

        state.history=
            state.history.slice(
                0,
                state.historyIndex+1
            );

    }

    state.history.push(snapshot);

    if(
        state.history.length>
        state.maxHistory
    ){

        state.history.shift();

    }else{

        state.historyIndex++;

    }

    state.historyIndex=
        state.history.length-1;

}

function restoreState(snapshot){

    state.document={
        ...snapshot.document
    };

    displayCanvas.width=
        state.document.width;

    displayCanvas.height=
        state.document.height;

    overlayCanvas.width=
        state.document.width;

    overlayCanvas.height=
        state.document.height;

    viewport.style.width=
        state.document.width+"px";

    viewport.style.height=
        state.document.height+"px";

    state.layers=[];

    let remaining=
        snapshot.layers.length;

    if(!remaining){

        state.selectedLayerId=null;
        state.selection=null;

        render();
        renderLayers();
        renderLayerProperties();

        return;

    }

    const finish=()=>{

        state.selectedLayerId=
            snapshot.selectedLayerId;

        state.selectedMask=
            snapshot.selectedMask;

        if(snapshot.selection){

            const selection=
                createSelectionMask();

            const image=
                new Image();

            image.onload=()=>{

                selection.ctx.drawImage(
                    image,
                    0,
                    0
                );

                state.selection=
                    selection;

                render();
                renderLayers();
                renderLayerProperties();
                renderToolOptions();

            };

            image.src=
                snapshot.selection;

        }else{

            state.selection=null;

            render();
            renderLayers();
            renderLayerProperties();
            renderToolOptions();

        }

    };

    for(const saved of snapshot.layers){

        const layer=
            createLayer(
                saved.name,
                saved.type
            );

        layer.id=saved.id;
        layer.x=saved.x;
        layer.y=saved.y;
        layer.opacity=saved.opacity;
        layer.visible=saved.visible;
        layer.locked=saved.locked;
        layer.maskEnabled=
            saved.maskEnabled;

        const image=
            new Image();

        image.onload=()=>{

            layer.ctx.drawImage(
                image,
                0,
                0
            );

            if(saved.mask){

                createMask(
                    layer,
                    255
                );

                const maskImage=
                    new Image();

                maskImage.onload=()=>{

                    layer.mask.ctx.drawImage(
                        maskImage,
                        0,
                        0
                    );

                    remaining--;

                    if(!remaining){
                        finish();
                    }

                };

                maskImage.src=
                    saved.mask;

            }else{

                remaining--;

                if(!remaining){
                    finish();
                }

            }

        };

        image.src=
            saved.image;

    }

}

function undo(){

    if(
        state.historyIndex<=0
    )return;

    state.historyIndex--;

    restoreState(
        state.history[
            state.historyIndex
        ]
    );

}

function redo(){

    if(
        state.historyIndex>=
        state.history.length-1
    )return;

    state.historyIndex++;

    restoreState(
        state.history[
            state.historyIndex
        ]
    );

}

workspace.addEventListener(
    "wheel",
    event=>{

        if(
            event.ctrlKey||
            event.metaKey
        ){

            event.preventDefault();

            const rect=
                workspace.getBoundingClientRect();

            setZoom(
                state.viewport.zoom*
                (
                    event.deltaY<0
                        ?1.1
                        :.9
                ),
                event.clientX-rect.left,
                event.clientY-rect.top
            );

        }

    },
    {
        passive:false
    }
);

/* ============================================================
   KEYBOARD
============================================================ */

document.addEventListener(
    "keydown",
    event=>{

        const tag=
            event.target.tagName;

        if(
            tag==="INPUT"||
            tag==="TEXTAREA"||
            tag==="SELECT"
        )return;

        const key=
            event.key.toLowerCase();

        if(
            (event.ctrlKey||
             event.metaKey)&&
            key==="z"
        ){

            event.preventDefault();

            if(event.shiftKey){
                redo();
            }else{
                undo();
            }

            return;

        }

        if(
            (event.ctrlKey||
             event.metaKey)&&
            key==="y"
        ){

            event.preventDefault();
            redo();
            return;

        }

        const shortcuts={
            v:"move",
            h:"hand",
            b:"brush",
            n:"pencil",
            e:"eraser",
            g:"bucket",
            i:"eyedropper",
            m:"rectSelect",
            l:"lasso"
        };

        if(shortcuts[key]){

            setTool(
                shortcuts[key]
            );

        }

        if(event.key==="Delete"){

            deleteSelectedPixels();

        }

        if(
            event.key==="+"||
            event.key==="="
        ){

            setZoom(
                state.viewport.zoom*1.1
            );

        }

        if(event.key==="-"){

            setZoom(
                state.viewport.zoom/.9
            );

        }

        if(event.key==="0"){

            fitToScreen();

        }

    }
);
